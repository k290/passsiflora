# Release build.  A tag vX.Y.Z builds every package the scripts in build/ can make on GitHub's runners, runs the CPU programs
# on the upstream work units against their truth files and makes a draft release with the packages, INSTALL.txt and
# SHA256SUMS (title and notes from docs/releases/<tag>.md).  Run by hand (Actions -> Release -> Run workflow) it does the same
# without the release: the packages, named 0.0.0, are kept as an artifact of the run.
# Not tested here: the GPU programs (no graphics card on the runners); test the draft's packages on a card before publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  QUICK_WUS: sf5_DS-14x11_Grp16409of705883 sf5_DS-14x11_Grp33043of705883

jobs:
  cuda-kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: CUDA 12.9 compiler
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq cuda-nvcc-12-9 cuda-cudart-dev-12-9 > /dev/null
      - name: Kernel
        run: NVCC=/usr/local/cuda-12.9/bin/nvcc OUT=$RUNNER_TEMP bash build/build-cuda-kernel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-fatbin
          path: ${{ runner.temp }}/nf_cuda_fatbin.h
          retention-days: 7

  # The Linux programs are built on Ubuntu 20.04: the GPU programs use the system's C library, so they run on glibc 2.31 or
  # newer (Ubuntu 20.04, Debian 11 and later; v0.6.1 and older, built on Ubuntu 22.04, needed glibc 2.34).  The compiler is
  # GCC 11 from Ubuntu's toolchain PPA, the same compiler as on Ubuntu 22.04.
  linux-x86-64:
    needs: cuda-kernel
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Tools (GCC 11 from Ubuntu's toolchain PPA)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq software-properties-common > /dev/null
          add-apt-repository -y ppa:ubuntu-toolchain-r/test > /dev/null
          apt-get install -y -qq build-essential gcc-11 g++-11 gfortran-11 libgmp-dev libboinc-app-dev \
            ocl-icd-opencl-dev opencl-headers bison perl python3 git ca-certificates patch > /dev/null
          for t in gcc g++ gfortran cpp; do ln -sf /usr/bin/$t-11 /usr/local/bin/$t; done
          ln -sf gcc /usr/local/bin/cc && ln -sf g++ /usr/local/bin/c++
          gcc --version | head -1 && gfortran --version | head -1 && ldd --version | head -1
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cuda-fatbin
          path: fatbin
      - name: Upstream source
        run: |
          bash build/fetch-upstream.sh /root/upstream
          UPSTREAM=/root/upstream OUT=/root/build_src OUT_FATBIN=$PWD/fatbin/nf_cuda_fatbin.h bash build/prepare-src.sh
          mkdir -p /pk/src && cp /root/build_src/GetDecicsSrc/* /pk/src/
          cp -r /root/upstream/Pari/pari-2.8-1711-ge5c317c /pk/pari28src
      - name: Build (PARI, CPU, OpenCL, CUDA)
        run: bash build/build-linux-chroot-inner.sh
      - name: Logs
        if: failure()
        run: tail -30 /root/pari_conf.log /root/pari_make.log || true
      - name: Test the CPU program on all work units
        run: |
          bash build/test-suite-unix.sh /root/pkb/GetDecics_cpu /root/upstream/Test/dataFiles $(nproc) | tee suite.txt
          grep -q 'SUMMARY: MATCH 31  DIFF 0' suite.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-x86-64
          path: |
            /root/pkb/GetDecics_cpu
            /root/pkb/GetDecics_gpu
            /root/pkb/GetDecics_cuda
          retention-days: 7

  windows-x86-64:
    needs: cuda-kernel
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git make patch bison perl diffutils
            mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-gmp
            mingw-w64-x86_64-opencl-headers mingw-w64-x86_64-python
      - uses: actions/download-artifact@v4
        with:
          name: cuda-fatbin
          path: fatbin
      - name: Upstream source
        run: |
          set -e
          bash build/fetch-upstream.sh upstream
          UPSTREAM=$PWD/upstream OUT=$PWD/build_src OUT_FATBIN=$PWD/fatbin/nf_cuda_fatbin.h bash build/prepare-src.sh
      - name: PARI
        run: |
          PARI_SRC=$PWD/upstream/Pari/pari-2.8-1711-ge5c317c WP=$PWD/wpari GMP=/mingw64 TOOLS=$PWD/tools AR=ar RANLIB=ranlib LOG=- \
            bash build/build-pari-mingw.sh
      - name: BOINC libraries
        run: MINGW=1 B=$PWD/boinc AR=ar RANLIB=ranlib bash build/build-boinc-libs.sh
      - name: Build (CPU, OpenCL, CUDA)
        run: |
          SRC=$PWD/build_src/GetDecicsSrc WP=$PWD/wpari B=$PWD/boinc G=/mingw64 OUT=$PWD/bin CLINC=/mingw64/include WORK=$PWD/wingpu \
            DLLTOOL=dlltool STRIP=strip PYTHON=python bash build/build-windows-gpu.sh
      - name: Test the CPU program on all work units
        run: |
          set -e
          bash build/test-suite-unix.sh $PWD/bin/GetDecics_cpu.exe $PWD/upstream/Test/dataFiles $(nproc) | tee suite.txt
          grep -q 'SUMMARY: MATCH 31  DIFF 0' suite.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows-x86-64
          path: bin/*.exe
          retention-days: 7

  # Ubuntu 20.04 with GCC 11, like linux-x86-64: the OpenCL program runs on glibc 2.31 or newer.
  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:20.04
    steps:
      - name: Tools (GCC 11 from Ubuntu's toolchain PPA)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq software-properties-common > /dev/null
          add-apt-repository -y ppa:ubuntu-toolchain-r/test > /dev/null
          apt-get install -y -qq build-essential gcc-11 g++-11 gfortran-11 libgmp-dev libboinc-app-dev \
            ocl-icd-opencl-dev opencl-headers bison perl python3 git ca-certificates patch > /dev/null
          for t in gcc g++ gfortran cpp; do ln -sf /usr/bin/$t-11 /usr/local/bin/$t; done
          ln -sf gcc /usr/local/bin/cc && ln -sf g++ /usr/local/bin/c++
          gcc --version | head -1 && gfortran --version | head -1 && ldd --version | head -1
      - uses: actions/checkout@v4
      - name: Upstream source
        run: |
          bash build/fetch-upstream.sh $HOME/up
          UPSTREAM=$HOME/up OUT=$HOME/bs bash build/prepare-src.sh
          mkdir -p $HOME/pk && cp -r $HOME/bs/GetDecicsSrc $HOME/pk/src && cp -r $HOME/up/Pari/pari-2.8-1711-ge5c317c $HOME/pk/pari
          rm -rf $HOME/pk/pari/O*   # upstream commits a prebuilt x86-64 PARI
      - name: Build (PARI, CPU, OpenCL)
        run: bash build/build-linux-aarch64.sh
      - name: Test the CPU program on all work units
        run: |
          bash build/test-suite-unix.sh $HOME/pk/src/GetDecics_cpu $HOME/up/Test/dataFiles $(nproc) | tee suite.txt
          grep -q 'SUMMARY: MATCH 31  DIFF 0' suite.txt
      - name: Collect
        run: mkdir -p out && cp $HOME/pk/src/GetDecics_cpu $HOME/pk/src/GetDecics_gpu out/
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-aarch64
          path: out/
          retention-days: 7

  linux-emulated:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        arch: [armhf]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Upstream source
        run: |
          bash build/fetch-upstream.sh up
          UPSTREAM=$PWD/up OUT=$PWD/bs bash build/prepare-src.sh
          mkdir -p pk && cp -r bs/GetDecicsSrc pk/src && cp -r up/Pari/pari-2.8-1711-ge5c317c pk/pari
          rm -rf pk/pari/O*   # upstream commits a prebuilt x86-64 PARI
      - name: Build and test in an emulated Ubuntu 22.04
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD":/w -w /w -e HOME=/w -e QUICK_WUS ubuntu:22.04 bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential gfortran libgmp-dev libboinc-app-dev bison perl python3 git ca-certificates > /dev/null
            # Ubuntu 22.04 ships empty BOINC libraries on armhf: build them from source there
            if ! nm /usr/lib/$(gcc -dumpmachine)/libboinc_api.a 2>/dev/null | grep -q " T boinc_init"; then bash build/build-boinc-libs.sh; fi
            bash build/build-linux-cpu-generic.sh
            bash build/test-suite-unix.sh /w/pk/src/GetDecics_cpu /w/up/Test/dataFiles 2 $QUICK_WUS | tee /w/suite.txt'
          grep -q 'SUMMARY: MATCH 2  DIFF 0' suite.txt
          mkdir -p out && cp pk/src/GetDecics_cpu out/
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.arch }}
          path: out/
          retention-days: 7

  # macOS: each architecture is built and tested natively on its own runner; macos-universal then joins the two.
  macos:
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }          # Apple silicon
          - { arch: x86_64, runner: macos-15-intel }   # Intel
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'   # PARI and BOINC are compiled for macOS 15, the program's minimum (the oldest macOS tested)
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install gcc gmp autoconf automake libtool pkgconf
      - name: Upstream source and PARI
        run: |
          W=$HOME/passiflora-work && mkdir -p $W
          bash build/fetch-upstream.sh $HOME/up
          UPSTREAM=$HOME/up OUT=$W/bs bash build/prepare-src.sh
          mv $W/bs/GetDecicsSrc $W/src
          cp -r $HOME/up/Pari/pari-2.8-1711-ge5c317c $W/pari && rm -rf $W/pari/O*   # upstream commits a prebuilt x86-64 PARI
          cd $W/pari && ./Configure --static --with-gmp=$(brew --prefix) --without-readline > $W/pari_conf.log
          cd O* && PERL5LIB=$W/pari/src/desc:$W/pari/src/desc/PARI make -j3 lib-sta > $W/pari_make.log
      - name: BOINC libraries
        run: |
          export PATH="$(brew --prefix libtool)/libexec/gnubin:$PATH"   # libtoolize (Homebrew names it glibtoolize)
          PREFIX=$HOME/boinc-install bash build/build-boinc-libs.sh
      - name: Build
        run: W=$HOME/passiflora-work BOINC=$HOME/boinc-install bash build/build-macos.sh
      - name: Logs
        if: failure()
        run: tail -30 $HOME/passiflora-work/pari_conf.log $HOME/passiflora-work/pari_make.log || true
      - name: Test the CPU program on all work units
        run: |
          bash build/test-suite-unix.sh $HOME/passiflora-work/src/GetDecics_cpu $HOME/up/Test/dataFiles $(sysctl -n hw.ncpu) | tee suite.txt
          grep -q 'SUMMARY: MATCH 31  DIFF 0' suite.txt
      - name: Test the baseline filter too (Intel Macs without AVX2)
        if: matrix.arch == 'x86_64'
        run: |
          sysctl -n machdep.cpu.brand_string machdep.cpu.leaf7_features   # AVX2 listed: the run above used the AVX2 filter
          NF_FORCE_BASE=1 bash build/test-suite-unix.sh $HOME/passiflora-work/src/GetDecics_cpu $HOME/up/Test/dataFiles 2 $QUICK_WUS | tee suite.txt
          grep -q 'SUMMARY: MATCH 2  DIFF 0' suite.txt
      - name: Collect
        run: mkdir -p out && cp $HOME/passiflora-work/src/GetDecics_cpu out/
      - uses: actions/upload-artifact@v4
        with:
          name: bin-macos-${{ matrix.arch }}
          path: out/
          retention-days: 7

  # One program for every Mac.  The package lists two BOINC platforms: arm64-apple-darwin (Apple silicon) and
  # x86_64-apple-darwin, which Intel Macs report, and so do Apple-silicon Macs running an Intel build of BOINC under
  # Rosetta.  A universal program is correct on all of them: macOS starts the half that matches the processor.
  macos-universal:
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-macos-*
          path: bins
      - name: Join the arm64 and x86_64 programs
        run: |
          mkdir -p out
          lipo -create -output out/GetDecics_cpu bins/bin-macos-arm64/GetDecics_cpu bins/bin-macos-x86_64/GetDecics_cpu
          chmod +x out/GetDecics_cpu && lipo -archs out/GetDecics_cpu
          # each half must be byte for byte the program that passed the tests on its own runner
          for a in arm64 x86_64; do lipo -thin $a -output $a.half out/GetDecics_cpu && cmp $a.half bins/bin-macos-$a/GetDecics_cpu; done
      - name: Run the universal program on two work units
        run: |
          bash build/fetch-upstream.sh $HOME/up
          bash build/test-suite-unix.sh $PWD/out/GetDecics_cpu $HOME/up/Test/dataFiles 2 $QUICK_WUS | tee suite.txt
          grep -q 'SUMMARY: MATCH 2  DIFF 0' suite.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bin-macos-universal
          path: out/
          retention-days: 7

  # Android (arm64).  The NDK has no Fortran compiler and runs only on x86-64, so the program is cross-compiled here with a
  # gfortran for Android built from GNU's sources (build/android/0-gfortran.sh, cached) and tested in android-test.
  android:
    runs-on: ubuntu-24.04
    env:
      NDK: /home/runner/android-ndk-r27c
      W: /home/runner/nfa
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # PARI's Configure runs Android test programs: arm64 containers on this x86-64 runner
        with:
          platforms: arm64
      - name: NDK r27c and Termux's image
        run: |
          sudo apt-get install -y -qq m4 > /dev/null
          cd $HOME && wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip && unzip -q android-ndk-r27c-linux.zip
          docker pull -q --platform linux/arm64 termux/termux-docker:aarch64
      # the toolchain is saved as soon as it is built, so that a later failure does not cost another build
      - uses: actions/cache/restore@v4
        id: gfortran
        with:
          path: ~/gfortran-android
          key: gfortran-android-${{ hashFiles('build/android/0-gfortran.sh') }}
      - name: gfortran for Android (GNU binutils and GCC 15.2)
        if: steps.gfortran.outputs.cache-hit != 'true'
        run: PREFIX=$HOME/gfortran-android WORK=$HOME/gfb bash build/android/0-gfortran.sh
      - uses: actions/cache/save@v4
        if: steps.gfortran.outputs.cache-hit != 'true'
        with:
          path: ~/gfortran-android
          key: ${{ steps.gfortran.outputs.cache-primary-key }}
      - name: Upstream source
        run: |
          bash build/fetch-upstream.sh $HOME/up
          UPSTREAM=$HOME/up OUT=$HOME/bs bash build/prepare-src.sh
      - name: GMP and PARI
        run: |
          export PARISRC=$HOME/up/Pari/pari-2.8-1711-ge5c317c
          bash build/android/1-gmp.sh && bash build/android/2-pari-configure.sh && bash build/android/3-pari-make.sh
      - name: BOINC libraries
        run: |
          T=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          # the flags of BOINC's own Android build (android/build_libraries_arm64.sh); the NDK has execinfo.h, but backtrace()
          # only from API level 33
          HOST=aarch64-linux CC=$T/aarch64-linux-android24-clang CXX=$T/aarch64-linux-android24-clang++ AR=$T/llvm-ar RANLIB=$T/llvm-ranlib \
            CFLAGS="-O3 -DANDROID -DANDROID_64 -DDECLARE_TIMEZONE" CXXFLAGS="-O3 -DANDROID -DANDROID_64" ac_cv_header_execinfo_h=no \
            PREFIX=$HOME/boinc-android bash build/build-boinc-libs.sh
      - name: Build
        run: GT=$HOME/gfortran-android/bin BOINC=$HOME/boinc-android SRC=$HOME/bs/GetDecicsSrc bash build/android/4-app.sh
      - name: Logs
        if: failure()
        run: tail -30 $W/*.log $HOME/gfb/*.log /tmp/boinc_*.log || true
      - name: Collect
        run: mkdir -p out && cp $W/src/GetDecics_cpu out/
      - uses: actions/upload-artifact@v4
        with:
          name: bin-android-aarch64
          path: out/
          retention-days: 7

  # The Android program on all work units, natively on an arm64 runner in Termux's Docker image, whose /system holds
  # Android's C library and linker (build/android/droidrun.sh).
  android-test:
    needs: android
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-android-aarch64
          path: bin
      - name: Upstream work units and Termux's image
        run: |
          bash build/fetch-upstream.sh $HOME/up
          docker pull -q termux/termux-docker:aarch64
      - name: Test the CPU program on all work units
        run: |
          chmod +x bin/GetDecics_cpu
          NF_ANDROID_PROG=$PWD/bin/GetDecics_cpu bash build/test-suite-unix.sh $PWD/build/android/droidrun.sh $HOME/up/Test/dataFiles $(nproc) | tee suite.txt
          grep -q 'SUMMARY: MATCH 31  DIFF 0' suite.txt

  freebsd-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Upstream source
        run: |
          bash build/fetch-upstream.sh up
          UPSTREAM=$PWD/up OUT=$PWD/bs bash build/prepare-src.sh
          mkdir -p w && cp -r bs/GetDecicsSrc w/src && cp -r up/Pari/pari-2.8-1711-ge5c317c w/pari
          rm -rf w/pari/O*   # upstream commits a prebuilt x86-64 PARI
      - name: Build and test in FreeBSD 14
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          mem: 8192
          copyback: true
          run: |
            set -e
            mkdir -p /root/w && cp -R w/src w/pari /root/w/
            sh build/freebsd/build-freebsd.sh
            mkdir -p out && cp /root/w/src/GetDecics_cpu out/
            pkg install -y bash > /dev/null
            bash build/test-suite-unix.sh /root/w/src/GetDecics_cpu "$PWD/up/Test/dataFiles" 4 | tee suite.txt
      - name: Check the test
        run: |
          cat suite.txt
          grep -q 'SUMMARY: MATCH 31  DIFF 0' suite.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bin-freebsd-x86-64
          path: out/
          retention-days: 7

  musa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Upstream source
        run: |
          bash build/fetch-upstream.sh up
          UPSTREAM=$PWD/up OUT=$PWD/bs bash build/prepare-src.sh
          mkdir -p work && cp -r bs/GetDecicsSrc work/src && cp -r up/Pari/pari-2.8-1711-ge5c317c work/pari
          rm -rf work/pari/O*   # upstream commits a prebuilt x86-64 PARI
      - name: Build in the MUSA container (PARI, then build-musa.sh)
        run: |
          docker run --rm -v "$PWD/work":/work -v "$PWD/build/build-musa.sh":/b.sh:ro mthreads/musa:rc4.3.0-devel-ubuntu22.04-amd64 bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gfortran g++ libgmp-dev bison perl make > /dev/null
            cd /work/pari && ./Configure --static --with-gmp --without-readline > /dev/null
            cd Olinux-x86_64 && PERL5LIB=/work/pari/src/desc:/work/pari/src/desc/PARI make -j4 lib-sta > /dev/null
            bash /b.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: bin-musa
          path: work/out/
          retention-days: 7

  # The Linux x86-64 programs must start on a system that has nothing but the graphics driver: each one is started in a
  # bare Debian 13 container with only the OpenCL loader added.  A missing shared library stops a program before it starts,
  # with exit code 127 (up to v0.6.0 the GPU programs needed libquadmath.so.0).  Without a card or input files the programs
  # then stop with their own message, which is all this checks.  They are started the same way in a bare Ubuntu 20.04, the
  # oldest system they are built for: a C library older than the one a program was linked against also stops it before it
  # starts ("version `GLIBC_2.34' not found"; v0.6.1 and older needed glibc 2.34).  Not MUSA, which needs Ubuntu 22.04.
  linux-bare-start:
    needs: [linux-x86-64, musa]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-x86-64
          path: bins/lin
      - uses: actions/download-artifact@v4
        with:
          name: bin-musa
          path: bins/musa
      - name: Start each program in a bare Debian 13 and a bare Ubuntu 20.04
        run: |
          chmod +x bins/lin/GetDecics_* bins/musa/GetDecics_musa
          start_in() {  # image, then the programs to start in it
            img=$1; shift
            echo "######## $img"
            docker run --rm -v "$PWD/bins":/b:ro "$img" bash -c '
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ocl-icd-libopencl1 > /dev/null
              bad=0
              for p in "$@"; do
                cd "$(mktemp -d)"
                timeout 60 "$p" < /dev/null > out.txt 2>&1; rc=$?
                echo "== $p: exit code $rc"; head -c 400 out.txt; echo
                if [ $rc = 127 ] || grep -q -e "error while loading shared libraries" -e "not found (required by" out.txt; then
                  echo "^ does not start"; bad=1
                fi
              done
              exit $bad' sh "$@"
          }
          bad=0
          start_in debian:13-slim /b/lin/GetDecics_cpu /b/lin/GetDecics_gpu /b/lin/GetDecics_cuda /b/musa/GetDecics_musa || bad=1
          start_in ubuntu:20.04 /b/lin/GetDecics_cpu /b/lin/GetDecics_gpu /b/lin/GetDecics_cuda || bad=1
          exit $bad

  package:
    needs: [linux-x86-64, windows-x86-64, linux-aarch64, linux-emulated, macos-universal, android-test, freebsd-x86-64, musa, linux-bare-start]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: A release needs every build
        if: startsWith(github.ref, 'refs/tags/v') && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped'))
        run: |
          echo "a build job did not succeed: no release"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins
      - name: Packages
        run: |
          ls -lR bins
          if [[ $GITHUB_REF == refs/tags/v* ]]; then export PASSIFLORA_VERSION=${GITHUB_REF_NAME#v}; else export PASSIFLORA_VERSION=0.0.0; fi
          b=$PWD/bins
          export PASSIFLORA_LIN_CPU=$b/bin-linux-x86-64/GetDecics_cpu PASSIFLORA_LIN_GPU=$b/bin-linux-x86-64/GetDecics_gpu \
                 PASSIFLORA_LIN_CUDA=$b/bin-linux-x86-64/GetDecics_cuda PASSIFLORA_LIN_MUSA=$b/bin-musa \
                 PASSIFLORA_WIN_CPU=$b/bin-windows-x86-64/GetDecics_cpu.exe PASSIFLORA_WIN_GPU=$b/bin-windows-x86-64/GetDecics_gpu.exe \
                 PASSIFLORA_WIN_CUDA=$b/bin-windows-x86-64/GetDecics_cuda.exe \
                 PASSIFLORA_A64_CPU=$b/bin-linux-aarch64/GetDecics_cpu PASSIFLORA_A64_GPU=$b/bin-linux-aarch64/GetDecics_gpu \
                 PASSIFLORA_ARM32_CPU=$b/bin-linux-armhf/GetDecics_cpu \
                 PASSIFLORA_MAC_CPU=$b/bin-macos-universal/GetDecics_cpu PASSIFLORA_ANDROID_CPU=$b/bin-android-aarch64/GetDecics_cpu PASSIFLORA_FBSD_CPU=$b/bin-freebsd-x86-64/GetDecics_cpu
          python3 build/make-release.py
          cp docs/INSTALL.txt dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          retention-days: 14
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # docs/releases/<tag>.md, if there is one, gives the title (its first line) and the notes
        run: |
          N=docs/releases/$GITHUB_REF_NAME.md
          if [ -f "$N" ]; then
            TITLE=$(head -1 "$N" | sed 's/^# *//'); tail -n +2 "$N" > "$RUNNER_TEMP/notes.md"
          else
            TITLE="Passiflora $GITHUB_REF_NAME"
            echo "Built by the release workflow from ${GITHUB_SHA::7}. Write the notes before publishing." > "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
